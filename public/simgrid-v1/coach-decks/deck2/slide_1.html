<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1.0">
<style>
*{box-sizing:border-box} body{margin:-1px} .slide-container{width:1280px;min-height:720px;background:#f7f8fa;color:#131921;font-family:Arial,Helvetica,sans-serif;position:relative;overflow:hidden;padding:56px 68px 0}
.kicker{font-size:17px;letter-spacing:2px;font-weight:700;color:#ff9900;text-transform:uppercase;opacity:0;animation:rise .55s ease-out .1s forwards}.title{font-size:58px;line-height:1.02;font-weight:800;max-width:680px;margin-top:18px;opacity:0;animation:rise .65s ease-out .2s forwards}.subtitle{font-size:24px;color:#4b5563;max-width:590px;margin-top:24px;opacity:0;animation:rise .6s ease-out .35s forwards}.rule{width:150px;height:6px;background:linear-gradient(90deg,#ff9900 0 33%,#00875a 33% 66%,#de350b 66%);margin-top:34px;opacity:0;animation:grow .7s ease-out .45s forwards}.loop{display:flex;align-items:center;gap:12px;margin-top:48px;opacity:0;animation:rise .7s ease-out .55s forwards}.step{font-size:17px;font-weight:700;padding:12px 16px;border:2px solid;border-radius:4px;background:#fff}.step:nth-child(1){border-color:#ff9900}.step:nth-child(3){border-color:#00875a}.step:nth-child(5){border-color:#4f8c9a}.step:nth-child(7){border-color:#de350b}.arrow{font-size:26px;color:#64748b}.visual{position:absolute;right:70px;top:118px;width:430px;height:420px;border:1px solid #d7dce2;background:#fff;padding:12px;box-shadow:0 12px 30px rgba(19,25,33,.08);opacity:0;animation:rise .8s ease-out .3s forwards}.visual img{width:100%;height:100%;object-fit:contain}.caption{position:absolute;left:68px;bottom:28px;font-size:14px;color:#64748b}.tag{position:absolute;right:72px;bottom:28px;font-size:14px;color:#64748b}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes grow{from{opacity:0;transform:scaleX(0);transform-origin:left}to{opacity:1;transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<div class="slide-container">
  <div class="kicker">Project Amazon PH Academy</div>
  <div class="title">Amazon PPC: Structure & Intent</div>
  <div class="subtitle">Instructor deck 2 · Modules 3–5: Hierarchy, match types, and listing readiness</div>
  <div class="rule"></div>
  <div class="loop"><span class="step">Learn</span><span class="arrow">→</span><span class="step">Simulate</span><span class="arrow">→</span><span class="step">Explain</span><span class="arrow">→</span><span class="step">Log</span></div>
  <div class="visual"><img src="../assets/simgrid-hub.jpg" alt="Project Amazon PH SimGrid hub"></div>
  <div class="caption">12 modules · 40 lessons · simulator-first practice</div>
  <div class="tag">01 / 12</div>
</div>
</body>
</html>
