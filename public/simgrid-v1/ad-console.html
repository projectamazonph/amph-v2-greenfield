const kfmt=n=>{n=Number(n)||0;return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(Math.round(n));};
const pctf=(n,d=2)=>(isFinite(n)?(n*100).toFixed(d):'0.00')+'%';
const hash=s=>{let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);};

const dayDate=d=>new Date(START.getTime()+d*864e5);

const bus=(()=>{const m=new Map();return{
 on(ev,fn){(m.get(ev)||m.set(ev,new Set()).get(ev)).add(fn);},
 off(ev,fn){const s=m.get(ev);if(s)s.delete(fn);},
 emit(ev,a){const s=m.get(ev);if(s)s.forEach(fn=>{try{fn(a);}catch(err){console.error('[bus]',ev,err);}});}
};})();

const emptyM=()=>({imp:0,clk:0,sp:0,sal:0,ord:0});
function addR(arr,d,r){arr[d]=arr[d]||emptyM();const t=arr[d];t.imp+=r.imp;t.clk+=r.clk;t.sp+=r.sp;t.sal+=r.sal;t.ord+=r.ord;return arr;}
function sumDaily(arr,from,to){const a=emptyM();for(let d=Math.max(0,from);d<=to;d++){const r=arr&&arr[d];if(r){a.imp+=r.imp||0;a.clk+=r.clk||0;a.sp+=r.sp||0;a.sal+=r.sal||0;a.ord+=r.ord||0;}}return a;}
function derive(m){m.ctr=m.imp?m.clk/m.imp:0;m.cpc=m.clk?m.sp/m.clk:0;m.cvr=m.clk?m.ord/m.clk:0;m.acos=m.sal?m.sp/m.sal:null;m.roas=m.sp?m.sal/m.sp:null;return m;}
function rangeBounds(){const rd=state.rangeDays;const to=state.day;const from=rd?Math.max(0,to-rd+1):0;return{from,to};}
function priorBounds(){const b=rangeBounds();const len=b.to-b.from+1;const pTo=b.from-1;const pFrom=pTo-len+1;if(pTo<0)return null;return{from:Math.max(0,pFrom),to:pTo};}
function campMetrics(c,b){b=b||rangeBounds();return derive(sumDaily(c.daily,b.from,b.to));}
function kwMetrics(k,b){b=b||rangeBounds();return derive(sumDaily(k.daily,b.from,b.to));}
function agMetrics(ag,b){b=b||rangeBounds();return derive(ag.keywords.reduce((acc,k)=>{const d=sumDaily(k.daily,b.from,b.to);acc.imp+=d.imp;acc.clk+=d.clk;acc.sp+=d.sp;acc.sal+=d.sal;acc.ord+=d.ord;return acc;},emptyM()));}
function allMetrics(b){b=b||rangeBounds();const m=emptyM();state.campaigns.forEach(c=>{const x=sumDaily(c.daily,b.from,b.to);m.imp+=x.imp;m.clk+=x.clk;m.sp+=x.sp;m.sal+=x.sal;m.ord+=x.ord;});return derive(m);}

function pickTerm(kw){
 const pool=kw.pool&&kw.pool.length?kw.pool:POOLS.earbuds;
 const tot=pool.reduce((s,e)=>s+e.v,0);let r=Math.random()*tot;
 for(const e of pool){r-=e.v;if(r<=0)return e;}
 return pool[0];
}
function attributeTerms(c,ag,kw,imp,clk,cpc,cvrM){
 let list;
 if(kw.hidden||kw.match==='exact'){list=[{t:kw.text.toLowerCase(),q:kw.hidden?.8:1}];}
 else{
  const n=Math.random()<.7?1:2;list=[];
  for(let i=0;i<n;i++){
   if(kw.match==='phrase'&&Math.random()<.5){
    const pre=pick(MOD_PRE),suf=pick(MOD_SUF);
    list.push({t:((pre?pre+' ':'')+kw.text+(suf?' '+suf:'')).trim(),q:.9});
   }else{const e=pickTerm(kw);list.push({t:e.t,q:e.q});}
  }
 }
 const ws=list.map(()=>.6+Math.random()*.8);const wsum=ws.reduce((a,b)=>a+b,0);
 const out=emptyM();out.cpc=cpc;
 list.forEach((tm,i)=>{
  const ti=Math.round(imp*ws[i]/wsum);const tc=stoch(clk*ws[i]/wsum);
  if(negated(c,tm.t))return;
  const sp=tc*cpc;
  const cvr=kw.cvr*kw.rel*tm.q*rnd(.8,1.25)*cvrM;
  const ord=stoch(tc*cvr);const sal=ord*kw.price;
  const key=c.id+'|'+ag.id+'|'+tm.t;
  let rec=state.terms[key];
  if(!rec&&Object.keys(state.terms).length<500){rec=state.terms[key]={id:uid(),text:tm.t,campId:c.id,agId:ag.id,kwText:kw.text,q:tm.q,firstDay:state.day,status:'none',imp:0,clk:0,sp:0,sal:0,ord:0};}
  if(rec){rec.imp+=ti;rec.clk+=tc;rec.sp+=sp;rec.sal+=sal;rec.ord+=ord;}
  out.imp+=ti;out.clk+=tc;out.sp+=sp;out.sal+=sal;out.ord+=ord;
 });
 return out;
}
function simHour(){
 const h=state.hour,w=HOUR_W[h]/24;
 const mods=scenMods();
 for(const c of state.campaigns){
  if(c.status!=='enabled')continue;
  if(c.spendToday>=c.budget)continue;
  c.hourly[state.day]=c.hourly[state.day]||Array.from({length:24},()=>({sp:0,sal:0}));
  c.placeStats[state.day]=c.placeStats[state.day]||{top:emptyM(),prod:emptyM(),rest:emptyM()};
  for(const ag of c.adGroups){
   if(ag.status!=='enabled')continue;
   for(const kw of ag.keywords){
    if(kw.status!=='enabled')continue;
    const effM=kw.market*mods.cpc;
    const bf=1/(1+Math.exp(-(kw.bid/effM-1)*3));
    const typeF=c.type==='SB'?.55:c.type==='SD'?.5:1;
    const imp=Math.round(kw.vol*mods.vol*w*(0.25+0.75*bf)*rnd(.7,1.3)*typeF);
    if(imp<=0)continue;
    const ctr=kw.ctr*(0.8+0.4*bf)*rnd(.85,1.15)*(mods.ctr||1)*(c.type==='SB'?.8:1);
    const stratF=c.strategy==='fixed'?1:c.strategy==='down'?(0.7+0.3*kw.rel):(0.65+0.7*kw.rel);
    const cpc=clamp(effM*rnd(.8,1.2)*stratF*(c.type==='SB'?1.25:1),.15,kw.bid*(c.strategy==='updown'?1.5:1));
    const pl=c.places||{top:0,prod:0,rest:0};
    const bfT=1/(1+Math.exp(-((kw.bid*(1+pl.top/100))/effM-1)*3));
    const shTop=clamp(.12+.5*bfT,.05,.62),shProd=.35,shRest=Math.max(.03,1-shTop-shProd);
    const segs=[['top',shTop,1.6,1.25,1.15],['prod',shProd,1.1,1.0,1.05],['rest',shRest,.7,.8,.9]];
    const termBefore=Object.fromEntries(Object.entries(state.terms).map(([key,term])=>[key,{imp:term.imp,clk:term.clk,sp:term.sp,sal:term.sal,ord:term.ord}]));
    const tot=emptyM();const segOut=[];
    for(const sg of segs){
      const impi=Math.round(imp*sg[1]);
      if(impi<=0){segOut.push(null);continue;}
      const clki=stoch(impi*ctr*sg[2]);
      const cpci=clamp(cpc*sg[3],.15,kw.bid*(1+pl[sg[0]]/100)*(c.strategy==='updown'?1.5:1));
      const res=attributeTerms(c,ag,kw,impi,clki,cpci,mods.cvr*sg[4]);
      segOut.push(res);
      tot.imp+=res.imp;tot.clk+=res.clk;tot.sp+=res.sp;tot.sal+=res.sal;tot.ord+=res.ord;
    }
    if(tot.imp<=0)continue;
    const rem=c.budget-c.spendToday;
    let capped=false;
    if(tot.sp>rem){
      capped=true;const f=rem>0?rem/tot.sp:0;
      segOut.forEach(s=>{if(!s)return;s.imp=Math.floor(s.imp*f);s.clk=Math.floor(s.clk*f);s.ord=Math.floor(s.ord*f);s.sp=s.clk*(s.cpc||cpc);s.sal=s.ord*kw.price;});
      tot.imp=Math.floor(tot.imp*f);tot.clk=Math.floor(tot.clk*f);tot.ord=Math.floor(tot.ord*f);
      tot.sp=Math.min(rem,tot.sp*f);tot.sal=tot.ord*kw.price;
      Object.entries(state.terms).forEach(([key,term])=>{
        const before=termBefore[key]||{imp:0,clk:0,sp:0,sal:0,ord:0};
        term.imp=before.imp+Math.floor((term.imp-before.imp)*f);
        term.clk=before.clk+Math.floor((term.clk-before.clk)*f);
        term.sp=before.sp+(term.sp-before.sp)*f;
        term.sal=before.sal+Math.floor((term.sal-before.sal)*f);
        term.ord=before.ord+Math.floor((term.ord-before.ord)*f);
      });
    }
    addR(kw.daily,state.day,tot);
    addR(c.daily,state.day,tot);
    c.spendToday+=tot.sp;
    c.hourly[state.day][h].sp+=tot.sp;c.hourly[state.day][h].sal+=tot.sal;
    segs.forEach((sg,i)=>{const s=segOut[i];if(!s)return;const ps=c.placeStats[state.day][sg[0]];ps.imp+=s.imp;ps.clk+=s.clk;ps.sp+=s.sp;ps.sal+=s.sal;ps.ord+=s.ord;});
    if(capped&&!c.outToday){c.outToday=true;log('warn','<b>'+esc(c.name)+'</b> hit its daily budget ('+money(c.budget)+') at '+h+':00 — ads paused until tomorrow.');}
    if(Math.random()<.07&&tot.clk>0)pushTicker('Won <b>'+kfmt(tot.imp)+'</b> impressions on “'+esc(kw.text)+'” @ <b>'+money(tot.sp/Math.max(1,tot.clk))+'</b> CPC',false);
    else if(bf<.32&&Math.random()<.1)pushTicker('Losing share on “'+esc(kw.text)+'” — bid '+money(kw.bid)+' vs market '+money(effM),true);
   }
  }
 }

function applyRules(){
 for(const rule of state.rules){
  if(!rule.enabled)continue;
  const targets=state.campaigns.filter(c=>rule.apply==='all'||rule.camps.includes(c.id));
  for(const c of targets){
   const m=derive(sumDaily(c.daily,state.day-7,state.day-1));
   let hit=false;
   if(rule.metric==='acos'&&m.sp>0&&m.sal>0&&m.acos*100<rule.value)hit=true;
   if(rule.metric==='roas'&&m.sp>0&&m.roas>rule.value)hit=true;

let pendingTickRender=false, __structural=true, _wireSig='';
function renderWire(){
 const slot=$('#wire-slot'); if(!slot)return;
 const onDash=state.view.name==='dashboard';
 document.body.classList.toggle('has-wire',onDash);
 if(!onDash){ if(slot.innerHTML){slot.innerHTML='';_wireSig='';} return; }
 const first=state.ticker[0];
 const sig=(state.ticker.length)+'|'+(first?first.id:'')+'|'+(__structural?1:0);
 if(sig===_wireSig)return;
 _wireSig=sig;
 slot.innerHTML=tickerHTML();
}
function render(){
 const structural=!pendingTickRender; pendingTickRender=false;
 __structural=structural;
 document.body.classList.toggle('anim-on',structural);
 destroyCharts();
 const v=state.view;const el=$('#content');
 let html='';
 try{html=buildView();}
 catch(err){html=errorCard(err);console.error(err);}
 let savedScroll=0;
 if(!structural){try{savedScroll=el.scrollTop;}catch(e){}}
 el.innerHTML=html;
 if(!structural){try{el.scrollTop=savedScroll;}catch(e){}}
 renderWire();
 // Chart rendering can fail independently per canvas (bad data, a blocked
 // CDN, a Chart.js quirk) — isolate it so one bad chart can't also take
 // down the sidebar badges/highlighting/bell below.
 $$('#content canvas[data-chart]').forEach(cv=>{
  try{if(cv.dataset.chart==='perf')perfChart(cv.id,cv.dataset.camp||null);else donut(cv.id);}
  catch(chartErr){console.error('chart render failed',chartErr);}
 });
 try{
  $$('.nv').forEach(n=>n.classList.toggle('on',n.dataset.view===((v.name==='campaign'||v.name==='adgroup')?'campaigns':v.name)));
  $('#nvCampN').textContent=state.campaigns.filter(c=>c.status!=='archived').length;
  $('#nvKwN').textContent=Object.keys(kwById).length;
  $('#nvTermN').textContent=Object.keys(state.terms).length;
  $('#nvLesN').textContent=state.lessonsDone.size+'/'+LESSONS.length;
  if(v.name==='dashboard'){state.unread=0;updateBell();}
 }catch(err2){console.error(err2);}
 state.animateNext=false;
}
let _frameQueued=false;
function onRenderRequest(){
 if(_frameQueued)return;
 _frameQueued=true;
 requestAnimationFrame(()=>{
  _frameQueued=false;
  if($('#modal-root').innerHTML!=='')return;
  const ae=document.activeElement;
  if(ae&&ae.matches&&ae.matches('#content input, #content select, #content textarea'))return;
  pendingTickRender=true;
  render();
 });
}

function genReport(type){
 const b=rangeBounds();const per=fmtDay(b.from)+' – '+fmtDay(b.to);let rows,title;
 if(type==='searchterm'){
  title='Search term report · '+per;
  rows=[['Search term','Campaign','Matched keyword','Impressions','Clicks','Spend','Sales','ACOS','Orders','Status']];
  Object.values(state.terms).sort((a,b2)=>b2.sp-a.sp).forEach(t=>rows.push([t.text,(campById[t.campId]||{}).name||'',t.kwText,t.imp,t.clk,money(t.sp),money(t.sal),t.sal?pctf(t.sp/t.sal):'—',t.ord,t.status]));
 }else if(type==='campaign'){
  title='Campaign performance · '+per;
  rows=[['Campaign','Type','Status','Budget','Impressions','Clicks','CTR','Avg CPC','Spend','Sales','ACOS','ROAS']];
  state.campaigns.forEach(c=>{const m=campMetrics(c,b);rows.push([c.name,c.type,statusOf(c).l,money(c.budget),m.imp,m.clk,pctf(m.ctr),money(m.cpc),money(m.sp),money(m.sal),m.sal?pctf(m.acos):'—',m.sp?m.roas.toFixed(2)+'x':'—']);});
 }else{
  title='Keyword report · '+per;
  rows=[['Keyword','Match type','Campaign','Bid','Impressions','Clicks','Spend','Sales','ACOS','Orders']];
  state.campaigns.forEach(c=>c.adGroups.forEach(ag=>ag.keywords.forEach(k=>{const m=kwMetrics(k,b);rows.push([k.text,k.match,c.name,money(k.bid),m.imp,m.clk,money(m.sp),money(m.sal),m.sal?pctf(m.acos):'—',m.ord]);})));
 }
 state.report={type:type,title:title,rows:rows,when:fmtDayFull(state.day)+' '+String(state.hour).padStart(2,'0')+':00'};
 toast('Report generated',title,'info');
 render();
}

function sugBidFor(text){const all=Object.values(POOLS).flat();const hit=all.find(e=>e.t===text);return r2(hit?hit.m*1.1:(0.6+(hash(text)%100)/100));}

 const pool=[];
 wz.products.forEach(pid=>{const cat=prod(pid).cat;(POOLS[cat]||[]).filter(e=>e.q>=.8).forEach(e=>{if(!pool.find(x=>x.t===e.t))pool.push(e);});});
 pool.sort((a,b)=>b.v-a.v);
 wz.sugs=pool.slice(0,7).map(e=>({text:e.t,match:'exact',bid:r2(e.m*1.1),on:true}));
}

 }

 td.innerHTML='<input class="inline-edit num" type="number" step="0.05" min="0.1" value="'+cur+'">';
 const inp=td.querySelector('input');inp.focus();inp.select();
 inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')commitInline(inp);if(ev.key==='Escape'){inp.dataset.cancel='1';render();}});
}
function commitInline(el){
 const td=el.closest('[data-act]');if(!td)return;
 const act=td.dataset.act,id=td.dataset.id;
 const val=parseFloat(el.value);
 el.dataset.cancel='1';
 if(!isFinite(val)||val<=0){render();return;}
 if(act==='edit-bid'){if(setBid(id,val)){const k=kwById[id];toast('Bid updated','“'+k.text+'” → '+money(k.bid)+'. The next auction hour will react.');markLesson('bid');}}
 else if(act==='edit-budget'){if(setBudget(id,val)){const c=campById[id];toast('Budget updated',esc(c.name)+' → '+money(c.budget)+'/day.');}}
 else if(act==='edit-agbid'){if(setAgBid(id,val)){const ag=agById[id];toast('Default bid updated',esc(ag.name)+' → '+money(ag.defaultBid));}}
 render();
}
function openStatusMenu(kind,id,anchor){
 closeMenu();
 const rect=anchor.getBoundingClientRect();
 let items='';
 if(kind==='camp'){const c=campById[id];if(!c)return;
  items=(c.status!=='enabled'?'<button type="button" data-act="set-status" data-kind="camp" data-id="'+id+'" data-v="enabled">▶ Enable</button>':'')+
   (c.status!=='paused'?'<button type="button" data-act="set-status" data-kind="camp" data-id="'+id+'" data-v="paused">❚❚ Pause</button>':'')+
   '<div class="pdiv"></div><button type="button" class="dngr" data-act="set-status" data-kind="camp" data-id="'+id+'" data-v="archived">🗄 Archive</button>';
 }else if(kind==='ag'){const ag=agById[id];if(!ag)return;
  items=ag.status==='paused'?'<button type="button" data-act="set-status" data-kind="ag" data-id="'+id+'" data-v="enabled">▶ Enable</button>':'<button type="button" data-act="set-status" data-kind="ag" data-id="'+id+'" data-v="paused">❚❚ Pause</button>';
 }else{const k=kwById[id];if(!k)return;
  items=k.status==='paused'?'<button type="button" data-act="set-status" data-kind="kw" data-id="'+id+'" data-v="enabled">▶ Enable</button>':'<button type="button" data-act="set-status" data-kind="kw" data-id="'+id+'" data-v="paused">❚❚ Pause</button>';
 }
 $('#menu-root').innerHTML='<div class="pop" style="left:'+clamp(rect.left,8,innerWidth-190)+'px;top:'+Math.min(rect.bottom+5,innerHeight-170)+'px">'+items+'</div>';
}
function addKeywordModal(campId,agId){
 const ag=agId?agById[agId]:(campById[campId]&&campById[campId].adGroups[0]);
 if(!ag)return;
 const c=campOfAg(ag.id)||{name:'—'};
 openModal('<div class="m-h"><h2>Add keyword</h2><button type="button" class="x" data-act="modal-close">✕</button></div>'+
 '<div class="m-b">'+
  '<div class="fhint" style="margin:-4px 0 12px">Adding to <b>'+esc(ag.name)+'</b> in <b>'+esc(c.name)+'</b></div>'+
  '<label class="fld">Keyword text</label><input class="inp" id="nkText" placeholder="e.g. bluetooth earbuds noise cancelling" style="margin-bottom:12px">'+
  '<div class="wz2col">'+
   '<div><label class="fld">Match type</label><select class="sel" id="nkMatch"><option value="exact">Exact — precise queries</option><option value="phrase">Phrase — contains phrase</option><option value="broad" selected>Broad — widest reach</option></select></div>'+
   '<div><label class="fld">Bid ($)</label><input class="inp num" id="nkBid" type="number" step="0.05" min="0.1" value="0.90"></div>'+
  '</div>'+
  '<div class="fhint" id="nkHint" style="margin-top:10px">💡 Suggested bid appears as you type.</div>'+
 '</div>'+
 '<div class="m-f"><button type="button" class="btn" data-act="modal-close">Cancel</button><button type="button" class="btn btn-p" data-act="nk-save" data-ag="'+ag.id+'">Add keyword</button></div>');
 const inp=$('#nkText');
 inp.addEventListener('input',()=>{const v=inp.value.trim();if(v.length>2){$('#nkHint').innerHTML='💡 Suggested bid for “'+esc(v)+'”: <b>$'+sugBidFor(v).toFixed(2)+'</b> (based on competition).';$('#nkBid').value=sugBidFor(v);}});
 inp.focus();
}
function toggleSim(){state.running=!state.running;document.body.classList.toggle('running',state.running);updateSimBar();
 toast(state.running?'▶ Simulation running':'❚❚ Simulation paused',state.running?'Auctions clear every hour.':'Time is frozen.',state.running?'success':'info');render();}
function skipDay(){for(let i=0;i<24;i++){state.hour++;if(state.hour>=24){state.hour=0;newDay();}simHour();}updateSimBar();toast('⏭ Skipped 24 hours',fmtDayFull(state.day)+' · budgets reset.');render();}

/* =====================================================================
   REGISTRIES
   ===================================================================== */
const VIEWS={
 dashboard:vDashboard, campaigns:vCampaigns, campaign:vCampaign, adgroup:vAdgroup,
 adgroups:vAdgroups, keywords:vKeywords, searchterms:vTerms, reports:vReports,
 rules:vRules, portfolios:vPortfolios, academy:vAcademy, glossary:vGlossary
};
const CAMP_TABS={
 overview:campOverviewTab, adgroups:campAdgroupsTab, keywords:campKeywordsTab,
 placements:placementsTab, searchterms:c=>termsTableHTML(Object.values(state.terms).filter(t=>t.campId===c.id),{campScope:true}),
 negatives:campNegativesTab, settings:campSettingsTab
};
const ACTIONS={
 'nav':(el)=>{document.body.classList.remove('nav-open');setView(el.dataset.view,el.dataset.id);render();},
 'burger':()=>{if(matchMedia('(max-width:900px)').matches)document.body.classList.toggle('nav-open');else document.body.classList.toggle('nav-mini');},
 'market':()=>toast('Marketplace switched','Demo only — data stays on Amazon.com.','info'),
 'global-search':()=>{const q=$('#globalSearch').value;state.filters.campaigns.q=q;setView('campaigns');render();},
 'sim-toggle':toggleSim,
 'sim-speed':(el)=>{state.speed=+el.dataset.v;$$('.sim-speed button').forEach(b=>b.classList.toggle('on',+b.dataset.v===state.speed));},
 'sim-skip':skipDay,
 'tour':startTour,
 'tour-next':()=>{tourI++;if(tourI>=TOURA.length){endTour();toast('Tour complete','You are ready. Check the Academy for missions.','info');}else showTourStep();},
 'tour-skip':endTour,
 'wel-tour':startTour,
 'wel-play':()=>{closeModal();toggleSim();},
 'create':startWizard,
 'modal-close':closeModal,
 'mroot':(el,e)=>{if(e.target===el)closeModal();},
 'err-dashboard':()=>{setView('dashboard');state.tab='overview';render();},
 'err-reload':()=>location.reload(),
 'wz-type':(el)=>{wz.type=el.dataset.v;renderWizard();},
 'scen-run':(el)=>{const s=SCENARIOS.find(x=>x.id===el.dataset.id);if(!s)return;state.scen={id:s.id,ends:state.day*24+state.hour+s.dur};log('warn','⚠️ Market event started: <b>'+s.name+'</b> — '+s.dur+'h ahead.');toast(s.icon+' '+s.name,'Traffic ×'+s.vol+' · CPC ×'+s.cpc+' · CVR ×'+s.cvr+' for '+s.dur+'h. React!','warn');markLesson('scenario');updateSimBar();render();},
 'scen-cancel':()=>{const s=SCENARIOS.find(x=>x.id===state.scen.id);state.scen=null;if(s){log('info','Market event ended early: <b>'+s.name+'</b>.');toast('Event ended',s.name+' cancelled.','info');}updateSimBar();render();},
 'heat-mode':(el)=>{state.heatMode=el.dataset.v;render();},
 'sort':(el)=>{const s=state.sort[el.dataset.tid]||(state.sort[el.dataset.tid]={key:null,dir:-1});if(s.key===el.dataset.k)s.dir*=-1;else{s.key=el.dataset.k;s.dir=-1;}render();},
 'tab':(el)=>{setTab(el.dataset.tab);render();},
 'status-menu':(el)=>openStatusMenu(el.dataset.kind,el.dataset.id,el),
 'set-status':(el)=>setStatus(el.dataset.kind,el.dataset.id,el.dataset.v),
 'quick-status':(el)=>setStatus('camp',el.dataset.id,el.dataset.v),
 'edit-bid':(el)=>editInline(el,el.dataset.act),
 'edit-budget':(el)=>editInline(el,el.dataset.act),
 'edit-agbid':(el)=>editInline(el,el.dataset.act),
 'ck-camp':(el)=>{const id=el.dataset.id;el.checked?state.selCamps.add(id):state.selCamps.delete(id);render();},
 'ck-kw':(el)=>{const id=el.dataset.id;el.checked?state.selKws.add(id):state.selKws.delete(id);render();},
 'bulk-clear':()=>{state.selCamps.clear();state.selKws.clear();render();},
 'bulk-camp':(el)=>{state.selCamps.forEach(id=>{if(campById[id])campById[id].status=el.dataset.v;});toast(state.selCamps.size+' campaigns → '+el.dataset.v);state.selCamps.clear();render();},
 'bulk-budget':(el)=>{state.selCamps.forEach(id=>{const c=campById[id];if(c)c.budget=r2(c.budget*+el.dataset.v);});toast('Budgets adjusted');state.selCamps.clear();render();},
 'bulk-kw':(el)=>{state.selKws.forEach(id=>{if(kwById[id])kwById[id].status=el.dataset.v;});toast(state.selKws.size+' keywords → '+el.dataset.v);state.selKws.clear();render();},
 'bulk-kwbid':(el)=>{state.selKws.forEach(id=>{const k=kwById[id];if(k)k.bid=r2(Math.max(.1,k.bid*+el.dataset.v));});toast('Bids adjusted by '+(+el.dataset.v>1?'+10%':'−10%'));state.selKws.clear();markLesson('bid');render();},
 'term-add':(el)=>{const t=Object.values(state.terms).find(x=>x.id===el.dataset.id);if(!t)return;const ag=agById[t.agId];const c=campById[t.campId];if(!ag||!c)return;
   const bid=r2(Math.max(.3,t.clk?(t.sp/t.clk)*1.1:sugBidFor(t.text)));
   const firstProd=ag.products.length?prod(ag.products[0]):prod(null);
   const nk=mkKw(t.text,'exact',bid,null,firstProd.price,POOLS[firstProd.cat]||POOLS.earbuds);
   nk.rel=Math.max(.3,Math.min(1,t.q));
   ag.keywords.push(nk);t.status='added';indexEntities();markLesson('harvest');
   log('success','Harvested “<b>'+esc(t.text)+'</b>” into <b>'+esc(c.name)+'</b> as exact match @ '+money(bid)+'.');
   toast('Keyword added','“'+t.text+'” is now an exact-match keyword at '+money(bid)+'.');render();},
 'term-neg':(el)=>{const t=Object.values(state.terms).find(x=>x.id===el.dataset.id);if(!t)return;const c=campById[t.campId];if(!c)return;
   c.negatives.push({t:t.text,m:'ne'});t.status='negated';markLesson('negative');
   log('warn','Negated “<b>'+esc(t.text)+'</b>” in <b>'+esc(c.name)+'</b> — no more spend on this query.');
   toast('Negative keyword added','“'+t.text+'” is blocked.','warn');render();},
 'add-neg':(el)=>{const c=campById[el.dataset.camp];if(!c)return;const v=$('#negInput').value.trim().toLowerCase();if(!v){toast('Type a negative keyword first','','warn');return;}
   c.negatives.push({t:v,m:$('#negMatch').value});markLesson('negative');log('warn','Negated “<b>'+esc(v)+'</b>” in <b>'+esc(c.name)+'</b>.');toast('Negative added',v,'warn');render();},
 'del-neg':(el)=>{const c=campById[el.dataset.camp];if(!c)return;c.negatives.splice(+el.dataset.i,1);toast('Negative removed');render();},
 'add-kw':(el)=>addKeywordModal(el.dataset.camp,el.dataset.ag),
 'nk-save':(el)=>{const ag=agById[el.dataset.ag];if(!ag)return;const c=campOfAg(ag.id)||{name:'—'};const text=$('#nkText').value.trim().toLowerCase();
   if(!text){toast('Enter keyword text','','warn');return;}
   const firstProd=ag.products.length?prod(ag.products[0]):prod(null);
   const k=mkKw(text,$('#nkMatch').value,parseFloat($('#nkBid').value)||sugBidFor(text),null,firstProd.price,POOLS[firstProd.cat]||POOLS.earbuds);
   ag.keywords.push(k);indexEntities();closeModal();log('info','Keyword <b>'+esc(text)+'</b> added to <b>'+esc(c.name)+'</b>.');toast('Keyword added',text);render();},
 'save-settings':(el)=>{const c=campById[el.dataset.id];if(!c)return;c.name=$('#setName').value.trim()||c.name;c.budget=Math.max(1,parseFloat($('#setBudget').value)||c.budget);c.strategy=$('#setStrat').value;c.portfolio=$('#setPort').value;toast('Settings saved',esc(c.name));render();},
 'archive-camp':(el)=>{const c=campById[el.dataset.id];if(!c)return;c.status='archived';log('danger','Campaign <b>'+esc(c.name)+'</b> archived.');toast('Campaign archived',esc(c.name),'warn');setView('campaigns');render();},
 'report':(el)=>genReport(el.dataset.type),
 'csv':downloadCSV,
 'rule-new':ruleModal,
 'rule-save':()=>{const name=$('#ruleName').value.trim()||'Untitled rule';
   const apply=document.querySelector('input[name="ruleApply"]:checked').value;
   const camps=$$('.ruleCamp').filter(x=>x.checked).map(x=>x.value);
   if(apply==='sel'&&!camps.length){toast('Select at least one campaign','','warn');return;}
   state.rules.push({id:uid(),name:name,metric:$('#ruleMetric').value,value:parseFloat($('#ruleValue').value)||25,pct:parseFloat($('#rulePct').value)||20,cap:parseFloat($('#ruleCap').value)||null,apply:apply,camps:camps,enabled:true,lastDay:null});
   markLesson('rule');closeModal();log('success','Budget rule <b>'+esc(name)+'</b> created.');toast('Rule created',name);render();},
 'rule-toggle':(el)=>{const r=state.rules.find(x=>x.id===el.dataset.id);if(r)r.enabled=!r.enabled;render();},
 'rule-del':(el)=>{state.rules=state.rules.filter(x=>x.id!==el.dataset.id);toast('Rule deleted','','warn');render();},
 'port-new':()=>{openModal('<div class="m-h"><h2>Create portfolio</h2><button type="button" class="x" data-act="modal-close">✕</button></div><div class="m-b"><label class="fld">Portfolio name</label><input class="inp" id="portName" placeholder="e.g. Q3 Launch"></div><div class="m-f"><button type="button" class="btn" data-act="modal-close">Cancel</button><button type="button" class="btn btn-p" data-act="port-save">Create</button></div>');$('#portName').focus();},
 'port-save':()=>{const n=$('#portName').value.trim();if(!n){toast('Enter a name','','warn');return;}state.portfolios.push({id:uid(),name:n});closeModal();toast('Portfolio created',n);render();},
 'lesson-open':(el)=>el.closest('.lesson').classList.toggle('open'),
 'lesson-go':(el)=>{const go=el.dataset.go;
   if(go==='create'){startWizard();return;}
   if(go==='play'){if(!state.running)toggleSim();toast('▶ Simulation running','Let it run — then observe the results.');return;}
   if(go==='placements'){const c=state.campaigns.find(x=>x.status!=='archived');if(c){setView('campaign',c.id);state.tab='placements';render();}return;}
   setView(el.dataset.view||'dashboard');render();},
 'lessons-reset':()=>{state.lessonsDone=new Set(['explore']);toast('Progress reset','All missions available again.','info');render();},
 'toggle-ds':(el)=>toggleDs(el.dataset.chart,+el.dataset.idx,el),
 'wz-prod':(el)=>{const id=el.dataset.id;wz.products.has(id)?wz.products.delete(id):wz.products.add(id);renderWizard();},
 'wz-addkw':()=>{captureWz();wz.custom.push({text:'',match:'broad',bid:''});renderWizard();},
 'wz-back':()=>{captureWz();wz.step--;renderWizard();},
 'wz-next':wzNext,
 'wz-launch':launchCampaign
};

/* =====================================================================
   LISTENERS
   ===================================================================== */
document.addEventListener('click',e=>{
 if(document.body.classList.contains('nav-open')&&!e.target.closest('#sidenav')&&!e.target.closest('[data-act="burger"]'))document.body.classList.remove('nav-open');
 const el=e.target.closest('[data-act]');if(!el)return;
 const fn=ACTIONS[el.dataset.act];
 if(fn){try{fn(el,e);}catch(err){console.error('[action]',el.dataset.act,err);toast('⚠️ '+err.message,'Action "'+el.dataset.act+'" failed. Data intact.','err');}}
 else console.warn('unknown action',el.dataset.act);
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.matches&&el.matches('input[name="wzStrat"],input[name="wzTgt"]')){
  $$('.radioc').forEach(rc=>{const ri=rc.querySelector('input[type="radio"]');if(ri)rc.classList.toggle('sel',ri.checked);});
 }
 const act=el.dataset.act;if(!act)return;
 if(act==='place-sl'){const c=campById[el.dataset.camp];const k=el.dataset.key;if(c&&c.places){c.places[k]=+el.value;markLesson('placement');toast('Placement updated',PLACE_L[k]+' bids now +'+el.value+'% in those auctions.');render();}return;}
 if(act==='range'){state.rangeDays=+el.value;render();return;}
 if(act.indexOf('f-camp-')===0){const k={q:'q',status:'status',type:'type',tgt:'tgt'}[act.split('-')[2]];state.filters.campaigns[k]=el.value;render();return;}
 if(act.indexOf('f-kw-')===0){const k={q:'q',camp:'camp',match:'match',status:'status'}[act.split('-')[2]];state.filters.keywords[k]=el.value;render();return;}
 if(act==='f-term-q'){state.filters.terms.q=el.value;render();return;}
});
document.addEventListener('input',e=>{
 const el=e.target;const act=el.dataset.act;if(!act)return;
 if(act==='place-sl'){const lv=$('#plv-'+el.dataset.key);if(lv)lv.textContent='+'+el.value+'%';return;}
 if(act==='f-camp-q'||act==='f-kw-q'||act==='f-term-q'){
  clearTimeout(el._t);
  el._t=setTimeout(()=>{
   const v=el.value;
   if(act==='f-camp-q')state.filters.campaigns.q=v;
   if(act==='f-kw-q')state.filters.keywords.q=v;
   if(act==='f-term-q')state.filters.terms.q=v;
   const pos=el.selectionStart;render();
   const again=document.querySelector('[data-act="'+act+'"]');if(again){again.focus();try{again.setSelectionRange(pos,pos);}catch(err){}}
  },350);
 }
});
document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){state.filters.campaigns.q=e.target.value;setView('campaigns');render();}});
addEventListener('resize',()=>{if(innerWidth>900)document.body.classList.remove('nav-open');if($('#tour-root').innerHTML)showTourStep();});

bus.on('render',onRenderRequest);

/* =====================================================================
   SIM BAR
   ===================================================================== */
function updateSimBar(){
 const d=$('#simDate');if(!d)return;
 d.textContent=fmtDayFull(state.day);
 $('#simClock').textContent=String(state.hour).padStart(2,'0')+':00 · Day '+(state.day+1);
 $('#simProg').style.width=((state.hour+1)/24*100)+'%';
 $('#simPlay').innerHTML=state.running?I.pause:I.play;
 $('#simDot').classList.toggle('live',state.running);
 $('#nvDot').classList.toggle('live',state.running);
 $('#nvSimDay').textContent='Day '+(state.day+1)+' · '+String(state.hour).padStart(2,'0')+':00';
 $('#nvSimSub').textContent=state.running?'Live · running at '+state.speed+'×':'Paused · press play to run time';
 const chip=$('#scenChip');const t=state.day*24+state.hour;
 if(state.scen&&state.scen.ends>t){const s=SCENARIOS.find(x=>x.id===state.scen.id);if(s){chip.style.display='inline-flex';chip.innerHTML=s.icon+' '+s.name+' · '+(state.scen.ends-t)+'h left';}else chip.style.display='none';}
 else chip.style.display='none';
}

/* =====================================================================
   BOOT
   ===================================================================== */
seed();
state.silent=true;
for(let d=0;d<14;d++){for(let h=0;h<24;h++){state.hour=h;simHour();}state.day++;state.campaigns.forEach(c=>{c.spendToday=0;c.outToday=false;});}
state.day0=state.day;
for(let h=0;h<=9;h++){state.hour=h;simHour();}
state.silent=false;
log('info','Welcome to the <b>AdConsole Pro</b>. Press play to run live auctions, or start with the Tour.');
log('info','<b>5 campaigns</b> imported with 14 days of history. “SP | Earbuds | Core Exact” is trending near its budget cap.');
updateSimBar();
render();
setTimeout(()=>{if(!state.welcomed){state.welcomed=true;openModal(welcomeHTML());}},600);
