<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
  <title id="title">PPC Foundations</title>
  <desc id="desc">Field-manual style cover plate for the PPC Foundations course: an ascending baseline bar chart with a readiness checkmark.</desc>
  <defs>
    <pattern id="grid-1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FAFAF7" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="550" fill="#1A1A1A"/>
  <rect width="1200" height="550" fill="url(#grid-1)"/>

  <!-- ghost tier numeral, bleeding off the right edge -->
  <text x="1180" y="430" text-anchor="end" font-family="Space Grotesk, system-ui, sans-serif" font-size="440" font-weight="700" fill="#FAFAF7" fill-opacity="0.07">01</text>

  <!-- top label -->
  <text x="90" y="86" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" letter-spacing="4" fill="#FAFAF7" fill-opacity="0.55">PROJECT AMAZON PH ACADEMY</text>

  <!-- icon: baseline ruler + ascending bars + readiness check -->
  <g transform="translate(460,150)" stroke-linecap="round" stroke-linejoin="round">
    <!-- baseline with tick marks -->
    <line x1="0" y1="270" x2="320" y2="270" stroke="#FAFAF7" stroke-opacity="0.5" stroke-width="3"/>
    <line x1="0" y1="270" x2="0" y2="282" stroke="#FAFAF7" stroke-opacity="0.5" stroke-width="3"/>
    <line x1="80" y1="270" x2="80" y2="282" stroke="#FAFAF7" stroke-opacity="0.5" stroke-width="3"/>
    <line x1="160" y1="270" x2="160" y2="282" stroke="#FAFAF7" stroke-opacity="0.5" stroke-width="3"/>
    <line x1="240" y1="270" x2="240" y2="282" stroke="#FAFAF7" stroke-opacity="0.5" stroke-width="3"/>
    <line x1="320" y1="270" x2="320" y2="282" stroke="#FAFAF7" stroke-opacity="0.5" stroke-width="3"/>

    <!-- three ascending bars, outline only -->
    <rect x="30" y="190" width="44" height="80" fill="none" stroke="#FF6B35" stroke-width="5"/>
    <rect x="138" y="130" width="44" height="140" fill="none" stroke="#FF6B35" stroke-width="5"/>
    <rect x="246" y="60" width="44" height="210" fill="none" stroke="#FF6B35" stroke-width="5"/>

    <!-- readiness check badge above tallest bar -->
    <circle cx="268" cy="24" r="22" fill="#1A1A1A" stroke="#FAFAF7" stroke-width="3"/>
    <path d="M258 24l7 8 14-16" fill="none" stroke="#FAFAF7" stroke-width="4"/>
  </g>

  <!-- bottom accent rule + labels -->
  <line x1="90" y1="470" x2="1110" y2="470" stroke="#FF6B35" stroke-width="4"/>
  <text x="90" y="510" font-family="JetBrains Mono, ui-monospace, monospace" font-size="24" letter-spacing="3" fill="#FAFAF7" fill-opacity="0.85">TIER 01</text>
  <text x="1110" y="512" text-anchor="end" font-family="Space Grotesk, system-ui, sans-serif" font-size="28" font-weight="600" fill="#FAFAF7">FOUNDATIONS</text>
</svg>
