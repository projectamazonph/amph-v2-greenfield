name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch on a new push
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 so the full history is present locally. This
      # is required by gitleaks, which computes a diff range of
      # `base^..head` for pull_request events and needs the base's
      # parent commit to be resolvable. Without this, gitleaks errors
      # with "fatal: ambiguous argument '<base>^': unknown revision".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate
        if: hashFiles('prisma/schema.prisma') != ''

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  architecture:
    name: Architecture (TDD + SOLID compliance)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run architecture compliance suite
        # Enforces 8 rules: use case coverage, entity coverage,
        # domain purity, dependency direction, single responsibility,
        # dependency inversion, port segregation, no circular deps.
        # See tests/architecture/*.test.ts for the full rule list.
        run: pnpm test:arch

  unit:
    name: Unit + integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: amph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d amph_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/amph_test
      JWT_SECRET: test-secret-at-least-32-bytes-long-please
      PAYMONGO_SECRET: sk_test_dummy
      PAYMONGO_WEBHOOK_SECRET: whsec_test_dummy
      RESEND_API_KEY: re_test_dummy
      SENTRY_DSN: ""
      EMAIL_VERIFICATION_SECRET: test-verification-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma generate
      - run: pnpm test
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: amph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d amph_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/amph_test
      JWT_SECRET: test-secret-at-least-32-bytes-long-please
      PAYMONGO_SECRET: sk_test_dummy
      PAYMONGO_WEBHOOK_SECRET: whsec_test_dummy
      RESEND_API_KEY: re_test_dummy
      SENTRY_DSN: ""
      EMAIL_VERIFICATION_SECRET: test-verification-secret
      # Dummy value so validateRequiredEnvVars()'s production fail-closed
      # check (added in review, closes a real silent-fallback-to-
      # LocalFileStorage gap) doesn't throw here. `pnpm build && pnpm start`
      # runs in production mode (next start always does, regardless of the
      # shell env), but this is CI, not a real deploy \u2014 same treatment as
      # every other secret above.
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_test_dummy
      # Dummy values keep the production rate-limit wiring fail-closed without
      # requiring a real Upstash account in CI. E2E exercises signup and API
      # routes that construct the Redis-backed limiter.
      UPSTASH_REDIS_REST_URL: https://example-upstash.test
      UPSTASH_REDIS_REST_TOKEN: test-upstash-token
      RATE_LIMITER_MODE: in-memory
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma generate
      # Seed both runtime inputs required by the simulator journey. Pages
      # need a published SimulatorScenario, while grading also needs the
      # matching ScorePolicy for the scenario difficulty and practice mode.
      # Both scripts use upserts, so CI reruns remain safe.
      - run: pnpm db:seed:scenarios
      - run: pnpm db:seed:policies
      # Install ALL Playwright browser dependencies + system deps.
      # Specifying only `chromium` was leaving the worker process unable to
      # launch the bundled browser (the error mentions a `webkit-2311`
      # cache path that is a red herning; the real failure is that the
      # install step did not provision the OS-level libs the binary needs).
      # `playwright install --with-deps` (no arg) installs chromium,
      # firefox, webkit, AND the system shared libs they depend on.
      - run: pnpm exec playwright install --with-deps
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  automation:
    name: Automation Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: amph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d amph_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/amph_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate simulator data
        run: pnpm validate:simulators
      - name: Run audit suite
        run: pnpm audit

  learning-release-gate:
    name: Learning release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, unit, e2e, automation]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate source inventory and public claims
        run: pnpm validate:learning-release
      - name: Report lesson production contract
        run: pnpm validate:lesson-production -- --report=lesson-production-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: lesson-production-report
          path: lesson-production-report.json
      - name: Record learner smoke prerequisite
        run: |
          echo "Learner smoke prerequisite: E2E (Playwright) passed in this workflow."
          echo "Release operators must attach the staging import output and logged-in smoke URL before production promotion."

  build:
    name: Build
    runs-on: ubuntu-latest
